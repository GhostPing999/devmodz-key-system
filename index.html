<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GHOST PING | Get Key</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#0b0917;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;

}

.container{

width:100%;
max-width:420px;

}

.card{

background:#151127;
border-radius:20px;
padding:30px;
box-shadow:0 0 25px rgba(0,0,0,.35);

}

.logo{

width:100px;
height:100px;
display:block;
margin:0 auto 20px;
border-radius:50%;
object-fit:cover;

}

.title{

text-align:center;
color:#ffffff;
font-size:30px;
font-weight:bold;

}

.subtitle{

text-align:center;
color:#bbbbbb;
margin-top:10px;
font-size:15px;

}

.info{

margin-top:30px;
background:#1d1733;
padding:15px;
border-radius:12px;

}

.info h3{

color:#ffffff;
margin-bottom:10px;

}

.info ul{

padding-left:20px;

}

.info li{

color:#d8d8d8;
margin:8px 0;

}

.warning{

margin-top:20px;
padding:15px;
border-radius:12px;
background:#2a1d05;
border:1px solid #4f3a00;
color:#ffd54f;

}

.btn{

width:100%;
height:55px;
margin-top:30px;
border:none;
border-radius:15px;
background:#7b2cff;
color:#ffffff;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.25s;

}

.btn:hover{

transform:scale(1.03);

}

.footer{

margin-top:20px;
text-align:center;
color:#777;
font-size:12px;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<img src="assets/logo.png" class="logo">

<h1 class="title">GHOST PING</h1>

<p class="subtitle">
Generate your secure online key
</p>

<div class="info">

<h3>Features</h3>

<ul>

<li>✔ Device Linked Key</li>

<li>✔ Valid Until Expiry</li>

<li>✔ Online Verification</li>

<li>✔ Fast Activation</li>

</ul>

</div>

<div class="warning">

⚠ Complete verification to receive your key.

</div>

<button class="btn" onclick="continueKey()">

GET KEY

</button>

<div class="footer">

GhostPing © 2026

</div>

</div>

</div>

  <script>

function continueKey(){

const btn=document.querySelector(".btn");

btn.disabled=true;
btn.innerHTML="PLEASE WAIT...";

setTimeout(function(){

window.location.href="https://vplink.in/GhostPing";

},700);

}

window.addEventListener("focus",function(){

const btn=document.querySelector(".btn");

btn.disabled=false;
btn.innerHTML="GET KEY";

});

window.addEventListener("pageshow",function(){

const btn=document.querySelector(".btn");

btn.disabled=false;
btn.innerHTML="GET KEY";

});

</script>

</body>
</html>
