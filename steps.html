<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GhostPing | Key</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b14;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{width:100%;max-width:430px;background:linear-gradient(#18142d,#12111d);border:1px solid #6d3cff55;border-radius:20px;padding:28px;text-align:center;box-shadow:0 0 35px #6d3cff33}
.logo{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid #7b2cff}
h1{margin:16px 0 8px;background:linear-gradient(90deg,#fff,#9b6dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.small{color:#bbb}
.status{margin:18px 0;padding:10px;border-radius:10px;background:#15251d;color:#5dff9a}
.key{margin:20px 0;padding:16px;border:2px dashed #7b2cff;border-radius:12px;background:#0f1020;word-break:break-all;font-weight:bold;color:#66ffb3}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#7b2cff;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<img class="logo" src="assets/logo.png" alt="GhostPing">
<h1>GhostPing</h1>
<div class="small">Your verification is complete.</div>
<div class="status">✓ Ready</div>
<div id="key" class="key">Loading...</div>
<button onclick="copyKey()">COPY KEY</button>
</div>
<script>
function makeKey(){
 const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 let out="GHOST-";
 for(let i=0;i<4;i++){
   for(let j=0;j<4;j++) out+=c[Math.floor(Math.random()*c.length)];
   if(i<3) out+="-";
 }
 document.getElementById("key").textContent=out;
}
function copyKey(){
 navigator.clipboard.writeText(document.getElementById("key").textContent).then(()=>alert("Key copied"));
}
window.onload=makeKey;
</script>
</body>
</html>
